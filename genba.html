<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YS現場ナビ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23ea580c'/><path d='M10 22 L16 9 L22 22 Z' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style> body { -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-gradient-to-r from-orange-600 to-amber-600 text-white shadow">
        <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 flex items-center gap-2 sm:gap-3">
            <button id="backBtn" class="hidden shrink-0 px-3 py-2 bg-white/20 rounded-lg text-sm active:bg-white/40">←</button>
            <div class="min-w-0 flex-1">
                <h1 class="text-base sm:text-xl font-bold leading-tight">YS現場ナビ</h1>
                <p id="crumb" class="text-[11px] sm:text-xs text-orange-100 truncate">製品を選んでください</p>
            </div>
            <button id="reloadBtn" onclick="reloadManuals()" class="hidden shrink-0 px-3 py-2 bg-white/20 rounded-lg text-sm active:bg-white/40" title="再読み込み">🔄</button>
        </div>
    </header>

    <main id="app" class="max-w-5xl mx-auto p-3 sm:p-4">
        <!-- ログイン前 -->
        <div id="authGate" class="bg-white rounded-xl shadow-sm p-6 text-center mt-6">
            <p class="text-3xl mb-2">🧭</p>
            <p class="text-sm text-slate-600 mb-4">会社のGoogleアカウントでログインしてください</p>
            <button id="signinBtn" onclick="handleSignin()" disabled
                class="w-full sm:w-auto px-6 py-3 bg-orange-600 text-white font-bold rounded-xl active:bg-orange-800 disabled:opacity-40">
                Googleでログイン
            </button>
            <p id="authMsg" class="text-xs text-slate-400 mt-3">読み込み中...</p>
        </div>
    </main>

    <script>
        // ===== 設定 =====
        const CLIENT_ID = '47228502594-hk66ecflb2s5iq02rim3o8j0j87d2p3c.apps.googleusercontent.com';
        const SPREADSHEET_ID = '1SlQp1j4WKkud47UgVq2VJrWu_miEd-oJ3yhKokJaOyM'; // YS現場ナビ 専用シート
        const SHEET_NAME = 'マニュアル';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/presentations.readonly'; // シート・スライドとも読み取りのみ

        // 用途の表示色（これ以外はグレー）
        // 用途（6つ固定）。この順でチップ表示・カード内訳を並べる
        const CATEGORIES = ['付属品', '初期設定', '設置', '操作', 'メンテ', 'トラブル'];
        const CAT_COLOR = {
            '付属品':   'bg-amber-100 text-amber-800',
            '初期設定': 'bg-violet-100 text-violet-700',
            '設置':     'bg-blue-100 text-blue-700',
            '操作':     'bg-emerald-100 text-emerald-700',
            'メンテ':   'bg-teal-100 text-teal-700',
            'トラブル': 'bg-red-100 text-red-700',
        };
        // 絞り込み状態（検索語・用途チップ）
        let filterText = '';
        let filterCat = '';   // '' = すべて

        let tokenClient, gapiInited = false, gisInited = false, accessToken = null;
        let MANUALS = [];
        let PRODUCTS = []; // 製品一覧（onclickは番号で参照）
        let refState = { slideId: '', start: 1, count: 1, pos: 0 };

        // ===== Google API 初期化・認証 =====
        function gapiLoaded() { gapi.load('client', initializeGapiClient); }
        async function initializeGapiClient() {
            await gapi.client.init({ discoveryDocs: [
                'https://sheets.googleapis.com/$discovery/rest?version=v4',
                'https://slides.googleapis.com/$discovery/rest?version=v1',
            ] });
            gapiInited = true; maybeReady();
        }
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (resp) => {
                    if (resp.error !== undefined) { setAuthMsg('ログインに失敗しました', true); return; }
                    accessToken = resp.access_token;
                    sessionStorage.setItem('genbaToken', accessToken);
                    gapi.client.setToken({ access_token: accessToken });
                    onSignedIn();
                },
            });
            gisInited = true; maybeReady();
        }
        function maybeReady() {
            if (!(gapiInited && gisInited)) return;
            document.getElementById('signinBtn').disabled = false;
            setAuthMsg('');
            const saved = sessionStorage.getItem('genbaToken');
            if (saved) {
                accessToken = saved;
                gapi.client.setToken({ access_token: saved });
                onSignedIn(true);
            }
        }
        function handleSignin() {
            if (!tokenClient) return;
            tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
        }
        function setAuthMsg(t, err) {
            const el = document.getElementById('authMsg');
            if (!el) return;
            el.textContent = t || '';
            el.className = 'text-xs mt-3 ' + (err ? 'text-red-600' : 'text-slate-400');
        }

        async function onSignedIn(silent) {
            try {
                await loadManuals();
                document.getElementById('authGate')?.classList.add('hidden');
                document.getElementById('reloadBtn').classList.remove('hidden');
                renderProducts();
            } catch (e) {
                console.error(e);
                sessionStorage.removeItem('genbaToken');
                accessToken = null;
                if (!silent) setAuthMsg('読み込みに失敗しました。もう一度ログインしてください', true);
            }
        }

        // ===== シート読み込み =====
        // 列: A製品 / B用途 / Cタイトル / DスライドID / E開始ページ / Fページ数 / G並び順
        async function loadManuals() {
            const resp = await gapi.client.sheets.spreadsheets.values.get({
                spreadsheetId: SPREADSHEET_ID,
                range: `${SHEET_NAME}!A2:F`,
            });
            const rows = resp.result.values || [];
            // 並び順＝シートの行順。開始/枚数が空なら「全ページ」（表示時にスライドの総ページ数を自動取得）
            MANUALS = rows.map((r) => {
                const startRaw = String(r[4] ?? '').trim();
                const countRaw = String(r[5] ?? '').trim();
                return {
                    product: String(r[0] || '').trim(),
                    category: String(r[1] || '').trim(),
                    title: String(r[2] || '').trim(),
                    slideId: extractSlideId(String(r[3] || '').trim()),
                    start: startRaw ? (parseInt(startRaw, 10) || 1) : null,   // null = 先頭から
                    count: countRaw ? (parseInt(countRaw, 10) || 1) : null,   // null = 最後まで
                };
            }).filter(m => m.product && m.title && m.slideId);
        }

        // スライドの総ページ数を取得（開始/枚数が空のマニュアル用）。結果はキャッシュ。
        const slidePageCache = {};
        async function getSlidePageCount(slideId) {
            if (slidePageCache[slideId]) return slidePageCache[slideId];
            try {
                const resp = await gapi.client.slides.presentations.get({ presentationId: slideId, fields: 'slides.objectId' });
                const n = (resp.result.slides || []).length || 1;
                slidePageCache[slideId] = n;
                return n;
            } catch (e) {
                console.warn('スライドのページ数取得に失敗（1枚として扱います）:', e);
                return 1;
            }
        }

        async function reloadManuals() {
            try { await loadManuals(); renderProducts(); }
            catch (e) { console.error(e); alert('再読み込みに失敗しました'); }
        }

        // スライドIDそのものでも、URLを貼っても拾えるようにする
        function extractSlideId(s) {
            const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return m ? m[1] : s;
        }

        function buildSlideEmbedUrl(page) {
            let u = `https://docs.google.com/presentation/d/${refState.slideId}/embed?start=false&loop=false&rm=minimal`;
            if (page) u += `&slide=${page}`;
            return u;
        }

        // ===== 画面 =====
        // 検索・用途で絞ったマニュアル
        function filteredManuals() {
            const q = filterText.trim().toLowerCase();
            return MANUALS.filter(m =>
                (!filterCat || m.category === filterCat) &&
                (!q || m.product.toLowerCase().includes(q) || m.title.toLowerCase().includes(q) || m.category.toLowerCase().includes(q))
            );
        }

        // 検索欄＋用途チップ（トップ共通）
        function filterBarHtml() {
            const chips = ['', ...CATEGORIES].map(c => {
                const on = (filterCat === c);
                const label = c || 'すべて';
                const cls = on ? 'bg-orange-600 text-white' : 'bg-white text-slate-700 border border-slate-300';
                return `<button type="button" onclick="setCat(${JSON.stringify(c)})" class="shrink-0 px-3 py-1.5 rounded-full text-sm font-semibold ${cls} active:scale-95">${label}</button>`;
            }).join('');
            return `
                <div class="mb-3">
                    <div class="relative">
                        <input id="searchBox" type="search" value="${escapeAttr(filterText)}" placeholder="製品名・マニュアル名で検索"
                            oninput="setText(this.value)" class="w-full pl-10 pr-3 py-3 rounded-xl border border-slate-300 bg-white text-base">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                    </div>
                    <div class="flex gap-2 overflow-x-auto mt-2 pb-1 -mx-1 px-1">${chips}</div>
                </div>`;
        }
        function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
        function setText(v) { filterText = v; renderProducts(true); }
        function setCat(c) { filterCat = c; renderProducts(); }

        function renderProducts(keepFocus) {
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('crumb').textContent = '製品を選んでください';
            const app = document.getElementById('app');

            if (MANUALS.length === 0) {
                app.innerHTML = `<div class="bg-white rounded-xl shadow-sm p-6 text-center text-sm text-slate-500 mt-4">マニュアルがまだ登録されていません。<br>スプレッドシートの「${SHEET_NAME}」に行を追加してください。</div>`;
                return;
            }

            const list = filteredManuals();
            const products = [...new Set(list.map(m => m.product))];
            PRODUCTS = products;
            const searching = filterText.trim() !== '';

            // 検索中はマニュアルを横断で直接並べる（製品をまたいで探せる）
            let body;
            if (searching) {
                body = list.length === 0
                    ? `<p class="text-center text-sm text-slate-500 py-8">該当なし</p>`
                    : `<div class="space-y-2">${list.map(m => manualRowHtml(m, true)).join('')}</div>`;
            } else {
                body = `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    ${products.map((p, pi) => {
                        const mine = list.filter(m => m.product === p);
                        // 用途内訳（登録がある用途だけ・固定順）
                        const breakdown = CATEGORIES.filter(c => mine.some(m => m.category === c)).map(c => {
                            const n = mine.filter(m => m.category === c).length;
                            return `<span class="inline-block text-[10px] px-1.5 py-0.5 rounded ${CAT_COLOR[c]}">${c}${n}</span>`;
                        }).join(' ');
                        return `
                        <button type="button" onclick="renderManualListByIdx(${pi})" class="text-left bg-white rounded-xl shadow-sm p-3 sm:p-4 min-h-[96px] active:scale-[0.98] transition">
                            <p class="text-base sm:text-lg font-bold text-slate-900 break-words leading-tight">${p}</p>
                            <p class="text-xs text-slate-500 mt-1">${mine.length}件</p>
                            <div class="mt-1.5 flex flex-wrap gap-1">${breakdown}</div>
                        </button>`;
                    }).join('')}
                </div>`;
            }

            app.innerHTML = filterBarHtml() + body;
            // 入力中はフォーカスを保つ（再描画で消えないように）
            if (keepFocus) {
                const box = document.getElementById('searchBox');
                if (box) { box.focus(); const v = box.value; box.value = ''; box.value = v; }
            }
        }

        // マニュアル1行（showProduct=true なら製品名も出す＝検索結果用）
        function manualRowHtml(m, showProduct) {
            const gi = MANUALS.indexOf(m);
            const color = CAT_COLOR[m.category] || 'bg-slate-100 text-slate-600';
            const pages = m.count === null ? '📑全ページ' : (m.count > 1 ? `📑${m.count}枚` : '');
            return `
            <button type="button" onclick="openManual(${gi})" class="w-full text-left bg-white rounded-xl shadow-sm p-4 flex items-center gap-3 active:scale-[0.99] transition">
                ${m.category ? `<span class="shrink-0 text-xs px-2 py-1 rounded-full ${color}">${m.category}</span>` : ''}
                <span class="flex-1 min-w-0">
                    ${showProduct ? `<span class="block text-[11px] text-slate-500">${m.product}</span>` : ''}
                    <span class="block font-semibold text-slate-800 leading-snug">${m.title}</span>
                </span>
                ${pages ? `<span class="shrink-0 text-xs text-blue-600 whitespace-nowrap">${pages}</span>` : ''}
                <span class="shrink-0 text-slate-300 text-xl">›</span>
            </button>`;
        }

        function renderManualListByIdx(i) { const p = PRODUCTS[i]; if (p !== undefined) renderManualList(p); }

        function renderManualList(product) {
            const back = document.getElementById('backBtn');
            back.classList.remove('hidden');
            back.onclick = () => renderProducts();
            document.getElementById('crumb').textContent = product;
            // シートの行順。用途チップの絞り込みは製品内でも効かせる
            const list = MANUALS.filter(m => m.product === product && (!filterCat || m.category === filterCat));
            document.getElementById('app').innerHTML = `
                <div class="space-y-2">
                    ${list.length ? list.map(m => manualRowHtml(m, false)).join('') : `<p class="text-center text-sm text-slate-500 py-8">この用途のマニュアルはありません</p>`}
                </div>`;
        }

        let currentManual = null;

        // マニュアルを開く：タップ直後（ユーザー操作の文脈内）に全画面＋横向きロックを先に要求してから、範囲を確定して表示
        async function openManual(index) {
            const m = MANUALS[index];
            if (!m) return;
            currentManual = m;
            showViewerOverlay(m);
            enterFullscreenLandscape(); // ← await の前に呼ぶ（全画面はタップの文脈内でしか許可されない）

            let start = m.start, count = m.count;
            if (start === null || count === null) {
                const total = await getSlidePageCount(m.slideId);
                if (start === null) start = 1;
                if (count === null) count = Math.max(1, total - start + 1);
            }
            refState = { slideId: m.slideId, start, count, pos: 0 };
            renderViewer();
        }

        // 全画面オーバーレイ（横向き前提のレイアウト）
        function showViewerOverlay(m) {
            document.getElementById('viewerOverlay')?.remove();
            const ov = document.createElement('div');
            ov.id = 'viewerOverlay';
            ov.className = 'fixed inset-0 bg-black flex items-center justify-center';
            ov.style.zIndex = '100';
            ov.innerHTML = `
                <!-- 戻る／タイトル -->
                <div class="absolute top-0 left-0 right-0 flex items-center gap-2 px-2 py-2" style="z-index:20;background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));">
                    <button type="button" onclick="closeViewer()" class="shrink-0 px-4 py-2 bg-white/25 text-white rounded-lg text-base font-bold active:bg-white/50">← 戻る</button>
                    <p class="min-w-0 flex-1 text-white text-sm truncate">${m.product}／${m.title}</p>
                </div>

                <!-- スライド（画面に収まる最大の16:9） -->
                <div class="relative" style="width:100vw;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;">
                    <iframe id="viewerFrame" src="" class="absolute inset-0 w-full h-full border-0" allowfullscreen></iframe>
                    <!-- スライド自体のタップめくりを無効化 -->
                    <div class="absolute inset-0" style="z-index:5;"></div>
                    <button type="button" id="prevBtn" onclick="viewerPrev()" class="hidden absolute left-2 top-1/2 -translate-y-1/2 w-16 h-16 flex items-center justify-center rounded-full bg-orange-600 border-4 border-white shadow-2xl active:bg-orange-800" style="z-index:10;" aria-label="前">
                        <span class="text-white font-bold" style="font-size:2.4rem;line-height:1;">‹</span>
                    </button>
                    <button type="button" id="nextBtn" onclick="viewerNext()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-16 h-16 flex items-center justify-center rounded-full bg-orange-600 border-4 border-white shadow-2xl active:bg-orange-800" style="z-index:10;" aria-label="次">
                        <span class="text-white font-bold" style="font-size:2.4rem;line-height:1;">›</span>
                    </button>
                    <div id="pageInd" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full text-white text-base font-bold" style="z-index:10;background:rgba(15,23,42,0.85);">1 / 1</div>
                </div>

                <!-- 縦持ちのときの案内（横向きロックが効かない端末＝iPhone等） -->
                <div id="orientHint" class="hidden absolute inset-x-0 bottom-0 pb-6 pt-10 text-center text-white" style="z-index:20;background:linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));">
                    <p class="text-3xl">📱↻</p>
                    <p class="text-sm font-bold">端末を横向きにしてください</p>
                </div>
            `;
            document.body.appendChild(ov);
            updateOrientationHint();
        }

        // 全画面＋横向きロック（対応端末のみ。iPhone Safariは横向きロック非対応）
        async function enterFullscreenLandscape() {
            const el = document.getElementById('viewerOverlay') || document.documentElement;
            try {
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } catch (e) { console.warn('全画面にできませんでした:', e); }
            try {
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
            } catch (e) { console.warn('横向きロック非対応（手動で横にしてください）:', e); }
            updateOrientationHint();
        }

        // ビューアを閉じる：ロック解除・全画面解除・一覧へ戻る（縦）
        function closeViewer() {
            try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
            try {
                if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
            } catch (e) {}
            document.getElementById('viewerOverlay')?.remove();
            if (currentManual) renderManualList(currentManual.product);
        }

        // 端末側の操作で全画面が解除されたら（戻るジェスチャー等）、ビューアも閉じる
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && document.getElementById('viewerOverlay')) {
                try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
                document.getElementById('viewerOverlay')?.remove();
                if (currentManual) renderManualList(currentManual.product);
            }
        });

        // 縦持ちなら「横にしてください」を表示、横なら消す
        function updateOrientationHint() {
            const hint = document.getElementById('orientHint');
            if (!hint) return;
            const portrait = window.matchMedia('(orientation: portrait)').matches;
            hint.classList.toggle('hidden', !portrait);
        }
        window.addEventListener('resize', updateOrientationHint);
        window.addEventListener('orientationchange', updateOrientationHint);

        function viewerPrev() { if (refState.pos > 0) { refState.pos--; renderViewer(); } }
        function viewerNext() { if (refState.pos < refState.count - 1) { refState.pos++; renderViewer(); } }

        function renderViewer() {
            const frame = document.getElementById('viewerFrame');
            if (frame) frame.src = buildSlideEmbedUrl(refState.start + refState.pos);
            const multi = refState.count > 1;
            const prev = document.getElementById('prevBtn');
            const next = document.getElementById('nextBtn');
            const ind = document.getElementById('pageInd');
            const bottom = document.getElementById('bottomNav');
            if (prev) { prev.classList.toggle('hidden', !multi); prev.style.opacity = (refState.pos === 0) ? '0.3' : '1'; }
            if (next) { next.classList.toggle('hidden', !multi); next.style.opacity = (refState.pos === refState.count - 1) ? '0.3' : '1'; }
            if (ind) { ind.classList.toggle('hidden', !multi); ind.textContent = `${refState.pos + 1} / ${refState.count}`; }
            if (bottom) bottom.classList.toggle('hidden', !multi);
        }
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
