<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS検品ナビ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2316a34a'/><stop offset='100%25' stop-color='%23166534'/></linearGradient></defs><circle cx='16' cy='16' r='15' fill='url(%23g)'/><path d='M9 16 L14 21 L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');
        * { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body>
    <div id="app">
        <div class="min-h-screen bg-slate-100 flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-green-600 mx-auto mb-4"></div>
                <p class="text-slate-600 text-lg">初期化中...</p>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '47228502594-hk66ecflb2s5iq02rim3o8j0j87d2p3c.apps.googleusercontent.com';
        const SPREADSHEET_ID = '1-Sv1ci9aQ80d5U42lTa2_eWfDCpsp2HESIOpHkOaxQQ';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let accessToken = null;
        let inventory = [];
        let inspectionHistory = [];
        let suppliers = [];
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        let html5QrCode = null;
        let currentUser = localStorage.getItem('inspectionUser') || '';

        // 不良理由リスト
        const DEFECT_REASONS = [
            '破損（輸送中）',
            '破損（製造不良）',
            '動作不良',
            '外観不良',
            '欠品・付属品不足',
            '仕様違い',
            'その他'
        ];

        // 対応リスト
        const DEFECT_ACTIONS = [
            '返品',
            '交換依頼',
            '修理',
            '値引き交渉',
            '廃棄',
            '保留'
        ];

        // ============================================================
        // 検品チェックリスト設定（ここを編集すれば項目を調整できます）
        // ============================================================
        // 参考資料のGoogleスライド（右ペインに埋め込み表示）
        // ※スライドは「リンクを知っている全員が閲覧可」または「ウェブに公開」にしておくこと
        const REFERENCE_SLIDES_ID = '1svgByR6Q_4uDGW3Tu-BFCgReN19QwoTewelb7IZNkdE';

        // スライドの埋め込みURLを組み立てる。slideId を渡すとそのスライドを先頭表示。
        function buildSlideEmbedUrl(slideId) {
            let url = `https://docs.google.com/presentation/d/${REFERENCE_SLIDES_ID}/embed?start=false&loop=false&rm=minimal`;
            if (slideId) url += `&slide=${slideId}`;
            return url;
        }

        // 検品項目（屋外サイネージ / STUDIA）
        //   name     : 点検項目
        //   desc     : 確認内容・手順
        //   slideId  : 参考スライドのID（あれば「参考」ボタンで右ペインに表示）。無ければ null
        //   note     : 参考テキスト（スライドではなく文章で示したい場合。任意）
        const INSPECTION_CHECKLIST = [
            { name: '付属品確認', desc: 'リモコンやその他の付属品が揃っているか確認、撮影する', slideId: 'g3fa14e77340_0_0', note: '' },
            { name: '外観写真撮影', desc: '製品の「前後左右4方向」から外観写真を撮影する', slideId: null, note: '' },
            { name: '背面内部の確認・撮影', desc: '後ろ扉を開け、カバー四隅にねじが正しく留まっているか確認し、撮影する', slideId: null, note: '' },
            { name: '内部基板・電池の確認', desc: 'それぞれのボードやケーブルの接続状況を細かく確認・撮影し、ボタン電池を確認する', slideId: null, note: '' },
            { name: '電源動作', desc: '電源のON/OFFが正常に行えるか', slideId: null, note: '' },
            { name: 'リモコン操作', desc: 'リモコンが正常に動作するか', slideId: null, note: '' },
            { name: '音量確認', desc: '音量が正常に出力・確認できるか', slideId: null, note: '' },
            { name: 'Wi-Fi接続・ネット確認', desc: 'Wi-Fiに接続し、実際にインターネット接続ができるか試す', slideId: null, note: '' },
            { name: '日時・言語設定', desc: 'システムの日時、言語合わせを行う(日本)', slideId: null, note: '' },
            { name: '明るさ調整', desc: '画面の明るさ調整ができるか。自動明るさ調整はスマホのライト等を当てて動作するか確認する', slideId: null, note: '' },
            { name: 'HDMI入力確認', desc: 'HDMIを接続し、画面が表示されるか、また文字崩れがないか確認する', slideId: null, note: '' },
            { name: 'USB自動再生', desc: 'USBを挿入した際、自動再生され、ループ再生するか確認する', slideId: null, note: '' },
            { name: 'バージョン確認', desc: 'システムのバージョン確認を行い、撮影する', slideId: null, note: '確認方法：設定→タブレット情報を7回クリック→開発者向けオプション→システム→WebViewの実装 を撮影。また Android バージョン等の画面も撮影する' },
            { name: 'データ削除', desc: '取り込んだ動画や画像、Wi-Fi接続等を削除する', slideId: null, note: '動画削除：設定→ファイルマネージャー→InternalMemory→MagicPlayer→Resource を長押し→削除' },
        ];

        // ダークモード初期化
        if (isDarkMode) {
            document.documentElement.classList.add('dark');
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            localStorage.setItem('darkMode', isDarkMode);
            renderMain();
        }

        function gapiLoaded() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
                });
                gapiInited = true;
                maybeEnableButtons();
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error) {
                        console.error(response);
                        return;
                    }
                    accessToken = response.access_token;
                    localStorage.setItem('lastToken', accessToken);
                    loadData();
                },
            });
            gisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                const savedToken = localStorage.getItem('lastToken');
                if (savedToken) {
                    gapi.client.setToken({ access_token: savedToken });
                    accessToken = savedToken;
                    loadData();
                } else {
                    renderLoginScreen();
                }
            }
        }

        function handleAuthClick() {
            if (!gapi.client.getToken()) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                loadData();
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                accessToken = null;
                localStorage.removeItem('lastToken');
            }
            renderLoginScreen();
        }

        function renderLoginScreen() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-green-600 to-emerald-800 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">YS検品ナビ</h1>
                        <p class="text-slate-500 mb-8">品質管理・検品記録システム</p>
                        <button onclick="handleAuthClick()" class="w-full py-4 bg-green-600 text-white text-lg font-semibold rounded-xl hover:bg-green-700 transition-all shadow-lg">
                            Googleでログイン
                        </button>
                        <p class="mt-6 text-xs text-slate-400">スプレッドシートへのアクセス許可が必要です</p>
                    </div>
                </div>
            `;
        }

        async function loadData() {
            try {
                showStatus('データ読み込み中...');

                // サプライヤー読み込み
                const suppliersRes = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'サプライヤー!A2:E',
                });
                suppliers = (suppliersRes.result.values || []).map(row => ({
                    id: row[0],
                    name: row[1],
                }));

                // 検品項目マスタ読み込み
                await loadInspectionItems();

                // 在庫読み込み
                const invRes = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:U',
                });
                inventory = (invRes.result.values || []).map(row => ({
                    id: row[0] || '',
                    serial: row[1] || '',
                    category: row[2] || '',
                    productName: row[3] || '',
                    orderPrefix: row[4] || '',
                    orderNumber: row[5] || '',
                    orderDate: row[6] || '',
                    receiveDate: row[7] || '',
                    status: row[8] || '入庫待ち',
                    shipDate: row[9] || '',
                    shipPrefix: row[10] || '',
                    shipNumber: row[11] || '',
                    costPrice: parseFloat(row[12]) || 0,
                    note: row[13] || '',
                    shelf: row[14] || '',
                    location: row[15] || '',
                    supplierId: row[16] || '',
                    // 新規カラム（R〜U）
                    inspectionDate: row[17] || '',
                    inspector: row[18] || '',
                    defectReason: row[19] || '',
                    inspectionNote: row[20] || ''
                }));

                // 検品履歴読み込み（シートがなければ作成）
                await loadInspectionHistory();

                renderMain();
            } catch (err) {
                console.error('読み込みエラー:', err);
                if (err.status === 401) {
                    localStorage.removeItem('lastToken');
                    renderLoginScreen();
                } else {
                    showStatus('エラー: ' + err.message, 'error');
                }
            }
        }

        // 検品項目マスタ
        let inspectionItemsMaster = {};

        async function loadInspectionItems() {
            try {
                const res = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '検品項目!A2:G',
                });
                const rows = res.result.values || [];
                inspectionItemsMaster = {};
                rows.forEach(row => {
                    const category = row[0] || '';
                    if (category) {
                        // 空でない項目のみ配列に追加
                        const items = row.slice(1).filter(item => item && item.trim());
                        inspectionItemsMaster[category] = items;
                    }
                });
                console.log('検品項目マスタ読み込み完了:', inspectionItemsMaster);
            } catch (e) {
                console.log('検品項目シートがありません。デフォルト項目を使用します。');
                // デフォルト項目
                inspectionItemsMaster = {
                    'default': ['外観チェック', '動作確認', '付属品確認']
                };
            }
        }

        // 種別から検品項目を取得
        function getInspectionItemsForCategory(category) {
            return inspectionItemsMaster[category] || inspectionItemsMaster['default'] || ['外観チェック', '動作確認', '付属品確認'];
        }

        async function loadInspectionHistory() {
            try {
                const res = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '検品履歴!A2:L',
                });
                inspectionHistory = (res.result.values || []).map(row => ({
                    inspectionId: row[0] || '',
                    inventoryId: row[1] || '',
                    serial: row[2] || '',
                    productName: row[3] || '',
                    supplierId: row[4] || '',
                    projectNumber: row[5] || '',
                    inspectionDate: row[6] || '',
                    inspector: row[7] || '',
                    result: row[8] || '',
                    defectReason: row[9] || '',
                    defectDetail: row[10] || '',
                    action: row[11] || ''
                }));
            } catch (e) {
                // シートがない場合は作成
                console.log('検品履歴シートを作成します');
                await createInspectionHistorySheet();
                inspectionHistory = [];
            }
        }

        async function createInspectionHistorySheet() {
            try {
                await gapi.client.sheets.spreadsheets.batchUpdate({
                    spreadsheetId: SPREADSHEET_ID,
                    resource: {
                        requests: [{
                            addSheet: {
                                properties: { title: '検品履歴' }
                            }
                        }]
                    }
                });
                // ヘッダー追加
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '検品履歴!A1:L1',
                    valueInputOption: 'RAW',
                    resource: {
                        values: [['検品ID', '在庫ID', 'Serial', '製品名', 'サプライヤーID', '案件番号', '検品日', '検品者', '結果', '不良理由', '不良詳細', '対応']]
                    }
                });
            } catch (e) {
                console.error('シート作成エラー:', e);
            }
        }

        function showStatus(message, type = 'info') {
            console.log(message);
        }

        function formatProjectNumber(prefix, number) {
            if (!prefix && !number) return '';
            return `${prefix || 'AD'}-${number || 0}`;
        }

        function getSupplierName(supplierId) {
            const s = suppliers.find(sup => String(sup.id) === String(supplierId));
            return s ? s.name : '不明';
        }

        // 検品待ちアイテムを取得
        function getPendingInspectionItems() {
            return inventory.filter(i => i.status === '検品待ち');
        }

        // 今日の検品済み件数
        function getTodayInspectionCount() {
            const today = new Date().toISOString().split('T')[0];
            return inspectionHistory.filter(h => h.inspectionDate === today).length;
        }

        // 今期の開始日を取得（7月〜6月が会計年度）
        function getCurrentFiscalYearStart() {
            const now = new Date();
            const year = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
            return `${year}-07-01`;
        }

        // 不良率計算（今期のみ）
        function getDefectRate() {
            const fiscalStart = getCurrentFiscalYearStart();
            const currentPeriodHistory = inspectionHistory.filter(h => h.inspectionDate >= fiscalStart);
            
            if (currentPeriodHistory.length === 0) return { rate: 0, total: 0, defects: 0, period: fiscalStart };
            const defects = currentPeriodHistory.filter(h => h.result === '不良品').length;
            return {
                rate: (defects / currentPeriodHistory.length * 100).toFixed(1),
                total: currentPeriodHistory.length,
                defects: defects,
                period: fiscalStart
            };
        }

        function renderMain() {
            const pending = getPendingInspectionItems();
            const todayCount = getTodayInspectionCount();
            const defectRate = getDefectRate();

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-slate-100 dark:bg-slate-900 transition-colors">
                    <!-- ヘッダー -->
                    <header class="bg-gradient-to-r from-green-600 to-emerald-700 text-white shadow-lg sticky top-0 z-30">
                        <div class="max-w-4xl mx-auto px-4 py-4">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                    </div>
                                    <div>
                                        <h1 class="text-xl font-bold">YS検品ナビ</h1>
                                        <p class="text-xs text-green-100">品質管理システム</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <a href="inventory.html" class="p-2 bg-white/20 rounded-lg hover:bg-white/30" title="在庫ナビ">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                                        </svg>
                                    </a>
                                    <a href="index.html" class="p-2 bg-white/20 rounded-lg hover:bg-white/30" title="調達ナビ">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                                        </svg>
                                    </a>
                                    <button onclick="toggleDarkMode()" class="p-2 bg-white/20 rounded-lg hover:bg-white/30">
                                        ${isDarkMode ? '☀️' : '🌙'}
                                    </button>
                                    <button onclick="handleSignoutClick()" class="p-2 bg-white/20 rounded-lg hover:bg-white/30" title="サインアウト">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-4xl mx-auto px-4 py-6">
                        <!-- 検品者設定 -->
                        <div class="mb-4 flex items-center gap-3">
                            <label class="text-sm text-slate-600 dark:text-slate-400">検品者:</label>
                            <input type="text" id="inspectorName" value="${currentUser}" 
                                   onchange="updateInspector(this.value)"
                                   class="px-3 py-1.5 border dark:border-slate-600 rounded-lg text-sm dark:bg-slate-800 dark:text-white"
                                   placeholder="名前を入力">
                        </div>

                        <!-- サマリーカード -->
                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <div class="bg-amber-100 dark:bg-amber-900/30 rounded-xl p-4 text-center">
                                <p class="text-3xl font-bold text-amber-700 dark:text-amber-400">${pending.length}</p>
                                <p class="text-xs text-amber-600 dark:text-amber-500">検品待ち</p>
                            </div>
                            <div class="bg-green-100 dark:bg-green-900/30 rounded-xl p-4 text-center">
                                <p class="text-3xl font-bold text-green-700 dark:text-green-400">${todayCount}</p>
                                <p class="text-xs text-green-600 dark:text-green-500">本日検品</p>
                            </div>
                            <div class="bg-red-100 dark:bg-red-900/30 rounded-xl p-4 text-center" title="今期: ${defectRate.defects}件/${defectRate.total}件">
                                <p class="text-3xl font-bold text-red-700 dark:text-red-400">${defectRate.rate}%</p>
                                <p class="text-xs text-red-600 dark:text-red-500">今期不良率</p>
                            </div>
                        </div>

                        <!-- QRスキャンボタン -->
                        <button onclick="openQRScanner()" class="w-full mb-6 py-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white text-lg font-bold rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-3">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h2M4 12h2m10 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
                            </svg>
                            QRスキャンで検品開始
                        </button>

                        <!-- 検品待ちリスト -->
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden">
                            <div class="px-4 py-3 bg-slate-50 dark:bg-slate-700 border-b dark:border-slate-600">
                                <h2 class="font-bold text-slate-800 dark:text-white">📋 検品待ちリスト</h2>
                            </div>
                            <div class="divide-y dark:divide-slate-700">
                                ${pending.length === 0 ? `
                                    <div class="p-8 text-center text-slate-400">
                                        <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        // 項目クリック → 右に該当シートを表示
        function openItemReference(index) {

            else if (ci.note) showNote(index);
            else showReference(null, index);
        }

        // 1つのcanvasを手書き可能にする
        function enableInkCanvas(c) {
            if (!c) return;
            const rect = c.getBoundingClientRect();
            c.width = Math.max(1, Math.round(rect.width));
            c.height = Math.max(1, Math.round(rect.height));
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#15803d'; // green-700
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            let drawing = false, lastX = 0, lastY = 0;
            const pos = (e) => {
                const r = c.getBoundingClientRect();
                return { x: e.clientX - r.left, y: e.clientY - r.top };
            };
            c.addEventListener('pointerdown', (e) => { drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; try { c.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
            c.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; e.preventDefault(); });
            c.addEventListener('pointerup', () => { drawing = false; });
            c.addEventListener('pointercancel', () => { drawing = false; });
        }

        // 手書きcanvasの初期化（各項目のチェック欄＋サイン欄）
        function initInkCanvases() {
            INSPECTION_CHECKLIST.forEach((_, i) => enableInkCanvas(document.getElementById('ink' + i)));
            enableInkCanvas(document.getElementById('inkSign'));
        }

        // 手書きを全部消す
        function clearAllInk() {
            const clear = (c) => { if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); };
            INSPECTION_CHECKLIST.forEach((_, i) => clear(document.getElementById('ink' + i)));
            clear(document.getElementById('inkSign'));
        }

        // 検品シート（手書き入り）をPDF化してダウンロード
        async function generateInspectionPDF(item) {
            const sheet = document.getElementById('inspectionSheet');
            if (!sheet || typeof html2canvas === 'undefined' || !window.jspdf) {
                console.warn('PDFライブラリまたは対象要素が見つかりません');
                return;
            }
            const shot = await html2canvas(sheet, { backgroundColor: '#ffffff', scale: 2, onclone: (doc) => { doc.documentElement.classList.remove('dark'); } });
            const imgData = shot.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
            const pageW = pdf.internal.pageSize.getWidth();
            const pageH = pdf.internal.pageSize.getHeight();
            const margin = 8;
            const availW = pageW - margin * 2;
            const availH = pageH - margin * 2;

            // 画像のアスペクト比を保ったまま、幅・高さ両方が1ページに収まる倍率で縮小フィット
            const imgRatio = shot.width / shot.height;
            let drawW = availW;
            let drawH = drawW / imgRatio;
            if (drawH > availH) {          // 縦がはみ出すなら高さ基準に切り替え
                drawH = availH;
                drawW = drawH * imgRatio;
            }
            // 横方向は中央寄せ
            const offsetX = margin + (availW - drawW) / 2;
            pdf.addImage(imgData, 'PNG', offsetX, margin, drawW, drawH);

            const fileName = `検品_${formatProjectNumber(item.orderPrefix, item.orderNumber)}_${(item.serial || 'NoSerial')}_${new Date().toISOString().split('T')[0]}.pdf`;
            pdf.save(fileName);
        }

        async function completeInspection(itemId, result) {
            const item = inventory.find(i => String(i.id) === String(itemId));
            if (!item) return;

            const today = new Date().toISOString().split('T')[0];
            let defectReason = '';
            let defectDetail = '';
            let defectAction = '';

            if (result === '不良品') {
                defectReason = document.getElementById('defectReason')?.value || '';
                defectDetail = document.getElementById('defectDetail')?.value || '';
                defectAction = document.getElementById('defectAction')?.value || '';
                
                if (!defectReason) {
                    alert('不良理由を選択してください');
                    return;
                }
            }

            try {
                // 1. 在庫シートの行を特定
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '在庫!A2:A',
                });
                const ids = response.result.values || [];
                const rowIndex = ids.findIndex(row => String(row[0]) === String(itemId));
                
                if (rowIndex === -1) {
                    alert('アイテムが見つかりません');
                    return;
                }
                const rowNum = rowIndex + 2;

                // 2. 在庫シートを更新（ステータス + 検品情報）
                const newStatus = result === '良品' ? '在庫中' : '不良品';
                await gapi.client.sheets.spreadsheets.values.batchUpdate({
                    spreadsheetId: SPREADSHEET_ID,
                    resource: {
                        valueInputOption: 'USER_ENTERED',
                        data: [
                            {
                                range: `在庫!I${rowNum}`,
                                values: [[newStatus]]
                            },
                            {
                                range: `在庫!R${rowNum}:U${rowNum}`,
                                values: [[today, currentUser, defectReason, defectDetail]]
                            }
                        ]
                    }
                });

                // 3. 検品履歴に追加
                const inspectionId = 'INS-' + Date.now();
                await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: SPREADSHEET_ID,
                    range: '検品履歴!A:L',
                    valueInputOption: 'USER_ENTERED',
                    resource: {
                        values: [[
                            inspectionId,
                            item.id,
                            item.serial,
                            item.productName,
                            item.supplierId,
                            formatProjectNumber(item.orderPrefix, item.orderNumber),
                            today,
                            currentUser,
                            result,
                            defectReason,
                            defectDetail,
                            defectAction
                        ]]
                    }
                });

                // 総合判定を検品シートに反映してからPDF出力（DOMを閉じる前に実行）
                try {
                    const rEl = document.getElementById('overallResult');
                    if (rEl) rEl.textContent = result;
                    await generateInspectionPDF(item);
                } catch (pdfErr) {
                    console.error('PDF出力エラー:', pdfErr);
                    alert('検品は記録しましたが、PDF出力に失敗しました。');
                }

                closeInspectionModal();
                
                // 成功フィードバック
                const feedback = document.createElement('div');
                feedback.className = `fixed top-4 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-lg text-white font-bold z-50 ${
                    result === '良品' ? 'bg-green-600' : 'bg-red-600'
                }`;
                feedback.textContent = `✓ ${result}として記録しました`;
                document.body.appendChild(feedback);
                setTimeout(() => feedback.remove(), 2000);

                // データ再読み込み
                await loadData();

            } catch (err) {
                console.error('検品記録エラー:', err);
                alert('エラーが発生しました: ' + err.message);
            }
        }

        // 初期化
        function checkAndInit() {
            if (typeof gapi !== 'undefined' && typeof google !== 'undefined') {
                gapiLoaded();
                gisLoaded();
            } else {
                setTimeout(checkAndInit, 100);
            }
        }
        
        document.addEventListener('DOMContentLoaded', checkAndInit);
    </script>
</body>
</html>
