<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e6e4de">
<title>YSナビ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23151515'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffd21f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@300;500&display=swap">
<style>
/* ============================================================
   YSナビ — 各ナビへの入口（Chromeのホーム用）。見た目は「機材のパネル」
   ・黒い窓：時計と今日の数字（押すとそのナビへ）
   ・キー：各ナビ。ランプ＝黄はやることあり／赤は不具合。1〜6キーでも押せる、/ で検索
   ・ログインは支払・在庫・品質ナビと共有（localStorage の googleAccessToken）
   ============================================================ */
:root{--bg:#e6e4de;--ink:#161616;--mute:#6b6a64;--y:#ffd21f;--r:#ff4a3d;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.page{max-width:1180px;margin:0 auto;padding:40px 40px 32px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}

/* 上の行 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:12px}
.logo b{font-weight:900;font-size:20px;letter-spacing:.06em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--y);box-shadow:0 0 0 3px rgba(255,210,31,.25),0 0 12px var(--y);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(255,210,31,.12),0 0 18px var(--y)}}
.search{display:flex;align-items:center;gap:10px;background:#dcdad3;border-radius:10px;height:42px;width:380px;max-width:100%;padding:0 14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12),0 1px 0 #f4f3ef;transition:background .2s,box-shadow .2s}
.search:focus-within{background:#f4f3ef;box-shadow:inset 0 1px 2px rgba(0,0,0,.08),0 0 0 2px var(--ink)}
.search .k{color:#8a887f}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:#8a887f}
.meta{color:var(--mute)}

/* パネル */
.panel{background:linear-gradient(#f4f3ef,#ebe9e3);border-radius:22px;padding:24px;box-shadow:inset 0 1px 0 #fff,0 1px 0 #cfccc4,0 26px 44px -26px rgba(0,0,0,.4)}

/* 黒い窓 */
.lcd{position:relative;background:#151515;border-radius:14px;padding:22px 26px;display:grid;grid-template-columns:1.15fr repeat(4,1fr);box-shadow:inset 0 2px 10px rgba(0,0,0,.7),inset 0 0 0 1px #000;overflow:hidden}
.lcd::after{ /* ガラスの映り込み */
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 38%)}
.cell{padding:0 22px;border-left:1px solid #2a2a2a;display:flex;flex-direction:column;min-width:0}
.cell:first-child{border:0;padding-left:0}
.cell .k{color:#8c8b85}
.v,.clock{font-family:'Barlow Condensed',sans-serif;font-weight:300;font-size:76px;line-height:1;margin-top:8px;color:#f2f0e8;font-variant-numeric:tabular-nums;transition:color .3s,text-shadow .3s,transform .25s var(--ease)}
.v.y{color:var(--y);text-shadow:0 0 18px rgba(255,210,31,.35)}
.v.r{color:var(--r);text-shadow:0 0 18px rgba(255,74,61,.4)}
.v.z{color:#4a4945}
.cell .s{color:#8c8b85;font-size:12px;margin-top:6px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.cell{cursor:pointer}
a.cell .go{color:#8c8b85;font-size:11px;margin-top:2px;opacity:0;transform:translateX(-4px);transition:all .25s var(--ease)}
a.cell:hover .v{transform:translateY(-3px)}
a.cell:hover .go{opacity:1;transform:none;color:var(--y)}
a.cell:focus-visible{outline:2px solid var(--y);outline-offset:4px;border-radius:6px}
.topr{justify-self:end;display:flex;align-items:center;gap:14px}
/* Google検索（右上） */
.gs{display:flex;align-items:center;gap:8px;background:#f4f3ef;border-radius:999px;height:42px;width:250px;padding:0 6px 0 14px;box-shadow:inset 0 1px 0 #fff,0 1px 0 #cfccc4,0 6px 12px -8px rgba(0,0,0,.35);transition:width .3s var(--ease),box-shadow .2s}
.gs:focus-within{width:300px;box-shadow:inset 0 1px 0 #fff,0 0 0 2px var(--ink),0 8px 16px -8px rgba(0,0,0,.35)}
.gs input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.gs input::placeholder{color:#8a887f}
.gs svg{width:16px;height:16px;color:#8a887f;flex-shrink:0}
.gs button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mute);padding:0}
.gs button:hover{background:#e6e3dc;color:var(--ink)}
/* Workspaceのアプリ（ログイン中だけ） */
.apps{position:relative;display:flex;align-items:center;gap:6px}
.apps[hidden]{display:none}
.apps .gm{font-size:13px;color:var(--ink);padding:6px 8px;border-radius:8px}
.apps .gm:hover{text-decoration:underline}
.waffle{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:#5f5e58;transition:background .15s}
.waffle:hover,.waffle[aria-expanded="true"]{background:#d7d4cc}
.waffle svg{width:20px;height:20px}
.pop{position:absolute;right:0;top:48px;z-index:20;width:300px;background:#f4f3ef;border-radius:20px;padding:10px;box-shadow:0 1px 0 #fff inset,0 24px 40px -16px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transform-origin:top right;animation:popin .22s var(--ease)}
.pop[hidden]{display:none}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(-6px)}}
.pop a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:14px;font-size:11.5px;white-space:nowrap;transition:background .15s;animation:drop .35s var(--ease) both;animation-delay:calc(var(--i)*25ms)}
.pop a:hover{background:#e6e3dc}
.pop a:hover img{transform:translateY(-2px)}
.pop img{width:38px;height:38px;transition:transform .2s var(--ease)}
.login{display:none;align-items:center;gap:12px;color:#6b6a64;font-size:12px;white-space:nowrap}
.login button{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;background:var(--y);color:var(--ink);border:0;border-radius:10px;height:42px;padding:0 18px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #b89600,0 10px 16px -8px rgba(184,150,0,.7);animation:nudge 2.6s ease-in-out infinite}
.login button:hover{transform:translateY(-1px)}
.login button:active{transform:translateY(3px);box-shadow:0 1px 0 #b89600;animation:none}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translateY(-3px)}92%{transform:none}}

/* キー */
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:22px}
.key{--c:#f4f3ef;--d:#c9c6bd;--hl:rgba(255,255,255,.35);position:relative;aspect-ratio:1/1.06;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--c);color:var(--ink);
  box-shadow:inset 0 1px 0 var(--hl),inset 0 -3px 0 rgba(0,0,0,.12),0 6px 0 var(--d),0 14px 20px -8px rgba(0,0,0,.35);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),opacity .2s;
  animation:drop .55s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.key:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hl),inset 0 -3px 0 rgba(0,0,0,.12),0 8px 0 var(--d),0 18px 24px -8px rgba(0,0,0,.35)}
.key:active,.key.down{transform:translateY(5px);transition-duration:.05s;box-shadow:inset 0 1px 0 var(--hl),inset 0 -1px 0 rgba(0,0,0,.12),0 1px 0 var(--d),0 4px 8px -4px rgba(0,0,0,.35)}
.key:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.key.dk{color:#f2f0e8}
.key .led{box-shadow:0 0 0 2px rgba(0,0,0,.22)} /* 縁取り：赤いキーの上でもランプが見えるように */
.key .led.on{box-shadow:0 0 0 2px rgba(0,0,0,.22),0 0 8px var(--y)}
.key .led.bad{box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 8px var(--r)}
.key .row{display:flex;justify-content:space-between;align-items:center}
.key .no{opacity:.75}
.key svg{width:30px;height:30px;transition:transform .35s var(--ease)}
.key:hover svg{transform:rotate(-8deg) scale(1.08)}
.key .n{font-size:21px;font-weight:900;letter-spacing:.02em}
.key .c{font-size:11px;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.key.dk .led{background:rgba(0,0,0,.2)}
.key .led.on,.led.on{background:var(--y);box-shadow:0 0 8px var(--y);animation:pulse 2.4s ease-in-out infinite}
.key .led.bad,.led.bad{background:var(--r);box-shadow:0 0 8px var(--r);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.key.dim{opacity:.25}
.key.hit{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hl),inset 0 -3px 0 rgba(0,0,0,.12),0 10px 0 var(--d),0 22px 26px -8px rgba(0,0,0,.4)}

/* 和田さんだけの小窓（Chromeの新しいタブのカレンダー・ドライブ欄のような箱） */
.wid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:start}
.wid[hidden]{display:none}
.box{background:#e3e0d8;border-radius:16px;padding:12px 8px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.box .hd{display:flex;justify-content:space-between;align-items:center;padding:0 8px 10px}
.box .hd b{font-size:13px;font-weight:700}
.box .hd a,.box .hd button{color:var(--mute);font-size:12px;background:none;border:0;padding:0}
.box .hd a:hover,.box .hd button:hover{color:var(--ink)}
.box .bd{background:#f4f3ef;border-radius:11px;overflow:hidden}
.row2{display:flex;align-items:center;gap:12px;padding:9px 12px;transition:background .15s;animation:drop .4s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
a.row2:hover{background:#fff}
.row2+.row2{border-top:1px solid #e6e3dc}
.row2 .ic{flex-shrink:0;width:30px;height:30px;border-radius:7px;background:var(--fc,#9a988f);display:grid;place-items:center;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.row2 .ic svg{width:15px;height:15px}
.row2 .tx{min-width:0;flex:1}
.row2 .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .sb{font-size:11px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;align-items:center;gap:12px;padding:10px 12px}
.ev+.ev{border-top:1px solid #e6e3dc}
.ev .tm{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;width:44px;flex-shrink:0}
.ev .nm{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .in{font-size:11px;color:var(--mute);background:#e6e3dc;border-radius:999px;padding:2px 8px;flex-shrink:0}
.ev .in.now{background:var(--y);color:var(--ink);font-weight:700}
.ev .join{font-size:11px;font-weight:900;background:var(--ink);color:#f4f3ef;border-radius:999px;padding:5px 10px;flex-shrink:0}
.empty{padding:14px 12px;font-size:12px;color:var(--mute)}
.empty button{margin-left:6px;background:var(--y);border:0;border-radius:8px;padding:5px 10px;font-weight:900;font-size:12px;box-shadow:0 2px 0 #b89600}

.bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px;color:var(--mute)}
.bottom .lg{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bottom i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.bottom button{background:none;border:0;color:inherit;padding:0;text-decoration:underline;font:inherit;letter-spacing:inherit;text-transform:inherit}

@media (max-width:900px){
  .page{padding:20px 16px 28px;justify-content:flex-start}
  .top{grid-template-columns:1fr auto;margin-bottom:14px}
  .search{grid-column:1/-1;grid-row:2;width:100%}
  .login .hint{display:none}
  .gs,.apps .gm{display:none}
  .panel{padding:14px;border-radius:18px}
  .lcd{grid-template-columns:repeat(2,minmax(0,1fr));padding:16px;row-gap:16px}
  .cell{padding:0 12px}
  .cell:first-child{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:12px;border-bottom:1px solid #2a2a2a;padding-bottom:12px}
  .cell:first-child .clock{font-size:44px;margin:0}
  .cell:nth-child(2),.cell:nth-child(4){border-left:0;padding-left:0}
  .v{font-size:54px}
  .keys{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
  .wid{grid-template-columns:1fr}
  .key{padding:12px;border-radius:14px}
  .key svg{width:24px;height:24px}
  .key .n{font-size:17px}
  .kb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="logo"><span class="dot" aria-hidden="true"></span><b>YSナビ</b></div>
    <label class="search">
      <span class="mono k">/</span>
      <input id="q" type="text" autocomplete="off" placeholder="ツール名・案件番号で探す" aria-label="ツールを探す・ドライブを検索" title="ツールが1つに絞れたらEnterで開く。それ以外はEnterでドライブを検索">
    </label>
    <div class="topr">
      <form class="gs" action="https://www.google.com/search" method="get" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input name="q" type="search" autocomplete="off" placeholder="Googleで検索" aria-label="Googleで検索">
      </form>
      <div class="login" id="login"><span class="hint">今日の数字を出す →</span><button type="button" id="loginBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>ログイン</button></div>
      <div class="apps" id="apps" hidden>
        <a class="gm" href="https://mail.google.com/" target="_blank" rel="noopener">Gmail</a>
        <button type="button" class="waffle" id="waffle" aria-label="Googleアプリ" aria-expanded="false" aria-controls="pop"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></button>
        <div class="pop" id="pop" hidden></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="lcd">
      <div class="cell"><span class="mono k">Time</span><span class="clock" id="clock">--:--</span><span class="s" id="date"></span></div>
      <a class="cell" id="st-pay" href="index.html" target="_blank" rel="noopener"><span class="mono k">支払待ち</span><span class="v z">–</span><span class="s"></span><span class="go">支払ナビ →</span></a>
      <a class="cell" id="st-arr" href="quality.html" target="_blank" rel="noopener"><span class="mono k">入荷 今日・明日</span><span class="v z">–</span><span class="s"></span><span class="go">品質ナビ →</span></a>
      <a class="cell" id="st-insp" href="quality.html" target="_blank" rel="noopener"><span class="mono k">検品まち</span><span class="v z">–</span><span class="s"></span><span class="go">品質ナビ →</span></a>
      <a class="cell" id="st-bad" href="quality.html" target="_blank" rel="noopener"><span class="mono k">不具合・遅れ</span><span class="v z">–</span><span class="s"></span><span class="go">中身を見る →</span></a>
    </div>

    <div class="keys" id="keys">
      <a class="key dk" style="--c:#c8463a;--d:#8e2c23;--i:0" href="https://an-kan-47228502594.asia-southeast1.run.app" target="_blank" rel="noopener" data-k="1" data-words="AN-KAN アンカン 案件 台帳 ステータス ankan">
        <div class="row"><span class="mono no">01</span><span class="led" id="l-ankan"></span></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
        <div><div class="n">AN-KAN</div><div class="c" id="c-ankan">案件台帳</div></div>
      </a>
      <a class="key" style="--c:#e0823f;--d:#a95a22;--i:1" href="https://yamato-72.github.io/ys-tools/deliverytime.html" target="_blank" rel="noopener" data-win="1" data-k="2" data-words="納期 のうき 集荷 連休 中国 deliverytime">
        <div class="row"><span class="mono no">02</span><span class="led"></span></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 14h3"/></svg>
        <div><div class="n">納期</div><div class="c">集荷日・納期の計算</div></div>
      </a>
      <a class="key" style="--c:#e9bd3c;--d:#b08a1c;--i:2" href="index.html" target="_blank" rel="noopener" data-k="3" data-words="支払 しはらい 発注 デポジット 入荷予定日 pay">
        <div class="row"><span class="mono no">03</span><span class="led" id="l-pay"></span></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <div><div class="n">支払</div><div class="c" id="c-pay">発注・支払</div></div>
      </a>
      <a class="key" style="--c:#c9995c;--d:#96703d;--i:3" href="inventory.html" target="_blank" rel="noopener" data-k="4" data-words="在庫 ざいこ 入庫 引当 出庫 シリアル inventory">
        <div class="row"><span class="mono no">04</span><span class="led" id="l-inv"></span></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
        <div><div class="n">在庫</div><div class="c" id="c-inv">入庫・引当・出庫</div></div>
      </a>
      <a class="key dk" style="--c:#4f9c95;--d:#336f6a;--i:4" href="quality.html" target="_blank" rel="noopener" data-k="5" data-words="品質 ひんしつ 検品 けんぴん 不具合 不良 quality">

<script>
const IS_TEST = new URLSearchParams(location.search).has('test');
const INV_ID = IS_TEST ? '1VwfwgSgfCN3CsO-L2kwtfqggy5sW9eMIGW8bGczxcFE' : '1-Sv1ci9aQ80d5U42lTa2_eWfDCpsp2HESIOpHkOaxQQ';

const CLIENT_ID = '47228502594-hk66ecflb2s5iq02rim3o8j0j87d2p3c.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.readonly'; // ほかのナビと同じ権限（ログイン共有のため）

/* ---------- 時計 ---------- */
const fmtTime = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDate = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'long', day: 'numeric', weekday: 'short' });
const fmtMeta = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
function tick() {

/* ---------- キー：数字キー・検索 ---------- */
const keys = [...document.querySelectorAll('.key')];
// 開き方：ふつうは別タブ。納期ナビだけ小さな別ウィンドウ（横に置いて使う計算機なので）
function openKey(k) {
  if (k.dataset.win) window.open(k.href, 'ys-nouki', 'popup,width=500,height=940');
  else window.open(k.href, '_blank', 'noopener');
}
function press(k) { k.classList.add('down'); openKey(k); setTimeout(() => k.classList.remove('down'), 180); }
keys.filter(k => k.dataset.win).forEach(k => k.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); openKey(k); }));
const q = $('q');
const nrm = s => String(s || '').normalize('NFKC').toLowerCase();
function matches() { const v = nrm(q.value.trim()); return v ? keys.filter(k => nrm(k.dataset.words + ' ' + k.querySelector('.n').textContent).includes(v)) : []; }
q.addEventListener('input', () => {
  const v = q.value.trim(), hit = matches();
  keys.forEach(k => { k.classList.toggle('dim', !!v && !hit.includes(k)); k.classList.toggle('hit', hit.length === 1 && hit[0] === k); });
});
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const hit = matches(), v = q.value.trim();
  if (hit.length === 1) press(hit[0]);
  else if (v) window.open('https://drive.google.com/drive/search?q=' + encodeURIComponent(v), '_blank');
});
document.addEventListener('keydown', e => {
  if (e.target === q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); return; }
  const k = keys.find(x => x.dataset.k === e.key);
  if (k) press(k);
});

/* ---------- ログイン（ほかのナビと共有） ---------- */
function savedToken() {
  try { const t = localStorage.getItem('googleAccessToken'), ex = +localStorage.getItem('tokenExpiresAt'); if (t && ex > Date.now() + 5 * 60000) return t; } catch (e) {}
  return null;
}
let tokenClient = null;
function loadScript(src) { return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }); }
async function login() {
  if (!window.google || !google.accounts) await loadScript('https://accounts.google.com/gsi/client');
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: r => {
      if (r.error) return;
      try { localStorage.setItem('googleAccessToken', r.access_token); localStorage.setItem('tokenExpiresAt', String(Date.now() + (r.expires_in || 3600) * 1000)); } catch (e) {}
      loadNumbers();
    }
  });
  tokenClient.requestAccessToken({ prompt: '' });
}
$('loginBtn').onclick = login;

/* ---------- Googleアプリ（ログイン中だけ。右上の点々ボタン） ---------- */
const GAPPS = [
  ['Gmail', 'https://mail.google.com/', 'gmail'],
  ['カレンダー', 'https://calendar.google.com/', 'calendar'],

  ['Meet', 'https://meet.google.com/', 'meet'],

  ['ドキュメント', 'https://docs.google.com/document/', 'docs'],

];
$('pop').innerHTML = GAPPS.map(([n, u, ic], i) => `<a href="${u}" target="_blank" rel="noopener" style="--i:${i}"><img src="https://ssl.gstatic.com/images/branding/product/2x/${ic}_2020q4_48dp.png" alt="" loading="lazy">${n}</a>`).join('');
function togglePop(open) { const p = $('pop'), b = $('waffle'); open = open ?? p.hidden; p.hidden = !open; b.setAttribute('aria-expanded', String(open)); }
$('waffle').onclick = e => { e.stopPropagation(); togglePop(); };

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pop').hidden) togglePop(false); });
function showApps(on) { $('apps').hidden = !on; if (!on) togglePop(false); }
$('reload').onclick = () => { loadNumbers(); loadAnkan(); };

/* ---------- 数字の計算（品質ナビの朝通知・支払ナビの「今日の確認」と同じ考え方） ---------- */
function okn(o) { return String(o || '').toUpperCase().replace(/\s/g, '').replace(/-0+(\d)/, '-$1'); }
function toYmd(v) { const m = String(v || '').trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2) : ''; }
const fmtYmd = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }); // YYYY-MM-DD
function projKey(p1, p2) { p1 = String(p1 || ''); return okn(/^[A-Z]+-\d+$/i.test(p1) ? p1 : (p1 || 'AD').replace(/-$/, '') + '-' + (p2 || '')); }

async function sheets(id, ranges, token) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?` + ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&');
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401 || res.status === 403) { const e = new Error('auth'); e.auth = true; throw e; }
  if (!res.ok) throw new Error('sheets ' + res.status);
  return (await res.json()).valueRanges.map(v => v.values || []);
}

function compute(invRows, projRows, now) {
  const today = fmtYmd.format(now), tomorrow = fmtYmd.format(new Date(now.getTime() + 864e5));
  const payProj = new Set(); let payRounds = 0;
  const arrival = {};
  projRows.forEach(r => {
    let deps = []; try { deps = JSON.parse(r[6] || '[]'); } catch (e) {}
    const unpaid = Array.isArray(deps) ? deps.filter(d => d && !d.paid).length : 0;
    const k = projKey(r[1], r[2]);
    if (unpaid) { payProj.add(k); payRounds += unpaid; }
    const d = toYmd(r[16]); if (d && (!arrival[k] || d < arrival[k])) arrival[k] = d;
  });
  const inv = invRows.filter(r => r[1] || r[3]).map(r => ({
    s: String(r[1] || '').trim(),
    o: (r[5] !== '' && r[5] !== undefined) ? String(r[4] || '') + '-' + r[5] : String(r[4] || ''),
    st: String(r[8] || '入庫待ち')
  }));
  const waitingOrders = {};
  inv.filter(x => x.s && x.st === '入庫待ち').forEach(x => { waitingOrders[x.o] = 1; });
  let arrToday = 0, arrTomorrow = 0, late = 0;
  Object.keys(waitingOrders).forEach(o => {
    const d = arrival[okn(o)]; if (!d) return;
    if (d === today) arrToday++; else if (d === tomorrow) arrTomorrow++; else if (d < today) late++;
  });
  const wh = inv.filter(x => x.s && WH.includes(x.st));
  return {
    payProj: payProj.size, payRounds, arrToday, arrTomorrow, late,
    inspWait: wh.filter(x => x.st === '検品待ち').length,
    bad: wh.filter(x => x.st === '不良品').length,
    waitingIn: inv.filter(x => x.s && x.st === '入庫待ち').length,
    allocated: inv.filter(x => x.s && x.st === '引当済').length
  };
}

/* ---------- 表示 ---------- */
function countTo(el, to) {
  const t0 = performance.now(), dur = 700;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || to === 0) { el.textContent = to; return; }
  (function step(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(step); })(t0);
}
function setStat(id, val, sub, tone) {
  const el = $(id), v = el.querySelector('.v');
  v.className = 'v ' + (val === 0 ? 'z' : tone);
  countTo(v, val);
  el.querySelector('.s').textContent = sub;
}
function setKey(id, text, led) { if (text != null) $('c-' + id).textContent = text; const l = $('l-' + id); if (l) l.className = 'led' + (led ? ' ' + led : ''); }

async function loadNumbers() {
  const token = savedToken();
  if (!token) { $('login').style.display = 'flex'; showApps(false); $('upd').textContent = '未ログイン'; return; }
  $('login').style.display = 'none'; showApps(true);
  $('upd').textContent = '読み込み中…';
  try {
    const [invRows, projRows] = await sheets(INV_ID, ['在庫!A2:Q', '案件!A2:Q'], token);
    const c = compute(invRows, projRows, new Date());
    setStat('st-pay', c.payProj, c.payProj ? `未払い ${c.payRounds}回分` : 'なし', 'y');
    setStat('st-arr', c.arrToday + c.arrTomorrow, `今日 ${c.arrToday}・明日 ${c.arrTomorrow}`, 'y');
    setStat('st-insp', c.inspWait, c.inspWait ? '届いて検品がまだ' : 'なし', 'y');
    setStat('st-bad', c.bad + c.late, (c.bad + c.late) ? `不良品 ${c.bad}・入荷遅れ ${c.late}` : 'なし', 'r');
    setKey('pay', c.payProj ? `支払待ち ${c.payProj}` : '支払待ちなし', c.payProj ? 'on' : '');
    setKey('inv', `入庫待ち ${c.waitingIn}・引当 ${c.allocated}`, '');
    setKey('qual', `検品 ${c.inspWait}・不良 ${c.bad}`, c.bad ? 'bad' : (c.inspWait ? 'on' : ''));
    $('upd').textContent = '更新 ' + fmtTime.format(new Date());
    loadWidgets(token);
  } catch (e) {
    if (e.auth) { try { localStorage.removeItem('googleAccessToken'); localStorage.removeItem('tokenExpiresAt'); } catch (x) {} $('login').style.display = 'flex'; showApps(false); $('upd').textContent = 'ログインが切れました'; return; }
    console.error(e); $('upd').textContent = '数字を読めませんでした';
  }
}
async function loadAnkan() {
  try {
    const res = await fetch(ANKAN_API); if (!res.ok) return;
    const a = await res.json();
    const active = Object.entries(a.pipeline || {}).filter(([s]) => s !== '残金請求済').reduce((n, [, v]) => n + v, 0);
    const soon = (a.deliveryAlerts || []).length, trouble = a.trouble || 0;
    setKey('ankan', `進行中 ${active}` + (soon ? `・納期近 ${soon}` : ''), trouble ? 'bad' : (soon ? 'on' : ''));
  } catch (e) { /* AN-KANが読めなくても入口としては使える */ }
}

/* ---------- 和田さんだけの小窓：カレンダー（今日のこれから）とドライブ（最近のファイル） ---------- */
const OWNER = 'toshihiro.wada8010@yamato-signage.com';
const CAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const FILE_COLOR = { document: '#3b6fd4', spreadsheet: '#1f9d61', presentation: '#e0a100', pdf: '#d2463a', image: '#8b5cf6', video: '#c2410c', script: '#3b82f6' };
const FILE_ICON = {
  document: '<path d="M7 8h10M7 12h10M7 16h6"/>',
  spreadsheet: '<path d="M5 9h14M5 15h14M10 5v14"/>',
  presentation: '<rect x="5" y="7" width="14" height="10" rx="1"/>',
  pdf: '<path d="M8 16V8h3a2 2 0 0 1 0 4H8"/>',
  image: '<path d="m5 17 4-5 3 3 2-2 5 4"/>',
  video: '<path d="m9 8 7 4-7 4z"/>',
  script: '<path d="M5 12h12M13 7l5 5-5 5"/>',
  '': '<path d="M8 6h6l4 4v8H8z"/>'
};
function fileKind(m) {
  if (m.includes('script')) return 'script';
  if (m.includes('document') || m.includes('wordprocessing')) return 'document';
  if (m.includes('spreadsheet') || m.includes('excel') || m.includes('csv')) return 'spreadsheet';
  if (m.includes('presentation') || m.includes('powerpoint')) return 'presentation';
  if (m.includes('pdf')) return 'pdf';
  if (m.startsWith('image/')) return 'image';
  if (m.startsWith('video/')) return 'video';
  return '';
}
function dayWord(iso) {
  const d = fmtYmd.format(new Date(iso)), t = fmtYmd.format(new Date()), y = fmtYmd.format(new Date(Date.now() - 864e5));
  if (d === t) return '今日'; if (d === y) return '昨日';
  const n = Math.round((new Date(t) - new Date(d)) / 864e5);
  return n < 7 ? n + '日前' : new Date(iso).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
}
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function gget(url, token) {
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) { const e = new Error('g ' + res.status); e.status = res.status; throw e; }
  return res.json();
}
async function whoAmI(token) {
  let me = '', tag = token.slice(-12);
  try { const c = JSON.parse(localStorage.getItem('ysnaviMe') || '{}'); if (c.tag === tag) me = c.me || ''; } catch (e) {}
  if (!me) { me = ((await gget('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', token)).user || {}).emailAddress || ''; try { localStorage.setItem('ysnaviMe', JSON.stringify({ tag, me })); } catch (e) {} }
  return me.toLowerCase();
}
async function loadFiles(token) {
  const q = encodeURIComponent("trashed = false and mimeType != 'application/vnd.google-apps.folder'");
  const r = await gget(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=5&corpora=allDrives&includeItemsFromAllDrives=true&supportsAllDrives=true&fields=files(id,name,mimeType,modifiedTime,webViewLink,lastModifyingUser(displayName,me))`, token);
  const files = r.files || [];
  $('files').innerHTML = files.map((f, i) => {
    const k = fileKind(f.mimeType), u = f.lastModifyingUser || {};
    const sub = u.me ? `${dayWord(f.modifiedTime)}変更を加えたファイル` : `${esc(u.displayName || '')} さんが編集（${dayWord(f.modifiedTime)}）`;
    return `<a class="row2" style="--i:${i};--fc:${FILE_COLOR[k] || '#9a988f'}" href="${esc(f.webViewLink)}" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${FILE_ICON[k]}</svg></span>
      <span class="tx"><div class="nm">${esc(f.name)}</div><div class="sb">${sub}</div></span></a>`;
  }).join('') || '<div class="empty">最近のファイルはありません</div>';
}
function connectCalendar() {
  // カレンダーを見る許可を足す（一度だけ。以後はほかのナビのログインにも含まれる）
  const go = () => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES + ' ' + CAL_SCOPE, include_granted_scopes: true,
      callback: r => {
        if (r.error) return;
        try { localStorage.setItem('googleAccessToken', r.access_token); localStorage.setItem('tokenExpiresAt', String(Date.now() + (r.expires_in || 3600) * 1000)); } catch (e) {}
        loadWidgets(r.access_token);
      }
    });
    tc.requestAccessToken({ prompt: 'consent' });
  };
  if (window.google && google.accounts) go(); else loadScript('https://accounts.google.com/gsi/client').then(go);
}
async function loadCalendar(token) {
  const now = new Date(), end = new Date(fmtYmd.format(now) + 'T23:59:59+09:00');
  let r;
  try {
    r = await gget(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(new Date(now - 30 * 60000).toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=10`, token);
  } catch (e) {
    if (e.status === 403 || e.status === 401) { $('cal').innerHTML = '<div class="empty">カレンダーはまだつながっていません<button type="button" id="calBtn">つなぐ</button></div>'; $('calBtn').onclick = connectCalendar; return; }
    throw e;
  }
  const evs = (r.items || []).filter(e => e.start && e.start.dateTime && e.status !== 'cancelled' && new Date(e.end.dateTime) > now).slice(0, 3);
  $('cal').innerHTML = evs.map(e => {
    const st = new Date(e.start.dateTime), mins = Math.round((st - now) / 60000);
    const when = mins <= 0 ? '<span class="in now">いま</span>' : `<span class="in">${mins < 60 ? mins + '分後' : Math.floor(mins / 60) + '時間後'}</span>`;
    const join = e.hangoutLink && mins <= 15 ? `<a class="join" href="${esc(e.hangoutLink)}" target="_blank" rel="noopener">参加</a>` : '';
    return `<div class="ev"><span class="tm">${fmtTime.format(st)}</span><a class="nm" href="${esc(e.htmlLink)}" target="_blank" rel="noopener">${esc(e.summary || '（予定）')}</a>${join || when}</div>`;
  }).join('') || '<div class="empty">今日のこれからの予定はありません</div>';
}
async function loadWidgets(token) {
  try {
    if ((await whoAmI(token)) !== OWNER) { $('wid').hidden = true; return; }
    $('wid').hidden = false;
    await Promise.all([loadFiles(token).catch(e => console.error(e)), loadCalendar(token).catch(e => console.error(e))]);
  } catch (e) { console.error(e); $('wid').hidden = true; }
}
loadNumbers(); loadAnkan();
let last = Date.now();
setInterval(() => { if (document.visibilityState === 'visible') { last = Date.now(); loadNumbers(); loadAnkan(); } }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - last > 60000) { last = Date.now(); loadNumbers(); loadAnkan(); } });
window.addEventListener('pageshow', e => { if (e.persisted) keys.forEach(k => k.classList.remove('down')); }); // 戻るで帰ってきたとき押しっぱなしにしない
</script>
