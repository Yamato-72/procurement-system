<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>YSナビ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f0f'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='28' fill='%23ffd21f' text-anchor='middle'%3EYS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* ============================================================
   YSナビ — 各ナビへの入口（Chromeのホーム用）
   ・上：今日の数字（支払・入荷・検品・不具合/遅れ）。押すとそのナビへ
   ・下：ツールのタイル。1〜6キーで開く、/ で検索
   ・ログインは支払・在庫・品質ナビと共有（localStorage の googleAccessToken）
   ============================================================ */
:root{
  --ink:#0f0f0f; --ink2:#1b1b1b; --line:#2c2c2c; --mute:#9a9a96; --paper:#f4f3ef;
  --y:#ffd21f; --red:#ff5a4f;
  --pay:#2b2b2b; --inv:#e7d7b8; --qual:#ffd21f; --prod:#bccfc8; --due:#d9dde3;
  --num:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 56px}

/* ---------- 上：黒い帯 ---------- */
.top{background:var(--ink);color:#fff;padding:36px 0 44px;position:relative;overflow:hidden}
.top::after{ /* うっすら方眼。動かない装飾 */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;z-index:1}
.brand{display:flex;align-items:baseline;gap:22px}
.mark{font-weight:900;font-size:22px;letter-spacing:.08em;color:var(--y)}
.date{font-size:15px;color:#cfcfcb;font-weight:500}
.clock{font-family:var(--num);font-weight:700;font-size:34px;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:10px;width:min(400px,100%);height:46px;border:2px solid #fff;padding:0 14px;transition:background .2s,border-color .2s}
.search:focus-within{background:#fff;color:var(--ink)}
.search svg{flex:none}
.search input{border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:15px;flex:1;min-width:0}
.search input::placeholder{color:#9a9a96}
.kbd{font-family:var(--num);font-size:13px;border:1px solid currentColor;padding:0 6px;opacity:.6;line-height:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:40px;position:relative;z-index:1}
.stat{padding:4px 28px 4px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative}
.stat+.stat{padding-left:28px}
.stat:last-child{border-right:0}
.stat .lbl{font-size:14px;color:#bdbdb8;font-weight:500}
.stat .n{font-family:var(--num);font-weight:700;font-size:96px;line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.stat .n small{font-family:'Zen Kaku Gothic New';font-size:20px;font-weight:700;margin-left:6px;letter-spacing:0}
.stat .sub{font-size:13px;color:#bdbdb8;min-height:19px}
.stat .go{font-size:13px;color:var(--y);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.stat .go i{font-style:normal;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.stat:hover .n{transform:translateY(-3px)}
.stat:hover .go i{transform:translateX(5px)}
.stat.zero .n{color:#5d5d5a}
.stat.alert .n{color:var(--red)}
.stat.act .n{color:#fff}
.stat.act .n::after{content:"";display:block;height:4px;width:44px;background:var(--y);margin-top:10px}
.stat.alert .n::after{content:"";display:block;height:4px;width:44px;background:var(--red);margin-top:10px}
.stat:focus-visible{outline:2px solid var(--y);outline-offset:6px}
.login{position:relative;z-index:1;margin-top:28px;display:none;align-items:center;gap:16px;font-size:14px;color:#cfcfcb}
.login button{background:var(--y);color:var(--ink);border:0;padding:10px 18px;font-weight:900}

/* ---------- 下：ツールのタイル ---------- */
.tools{padding-top:40px;padding-bottom:28px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#55554f}
.head span{font-size:12px;color:#77776f}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.tile{--c:#fff;--fg:var(--ink);position:relative;background:var(--c);color:var(--fg);border:2px solid var(--ink);min-height:178px;padding:20px 22px;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s cubic-bezier(.2,.8,.2,1),opacity .2s;
  opacity:0;transform:translateY(14px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{to{opacity:1;transform:none}}
.tile::before{ /* マウスの位置にうっすら光 */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 60%)}
.tile.dark::before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.12),transparent 60%)}
.tile:hover::before{opacity:1}
.tile:hover,.tile:focus-visible{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--ink);outline:0}
.tile:active{transform:translate(0,0);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
.tile .ic{width:44px;height:44px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile:hover .ic{transform:rotate(-8deg) scale(1.08)}
.tile .nm{font-size:26px;font-weight:900;margin-top:auto;letter-spacing:.02em}
.tile .ds{font-size:13px;opacity:.75;margin-top:2px}
.tile .key{position:absolute;top:16px;right:18px;font-family:var(--num);font-size:15px;font-weight:700;border:1.5px solid currentColor;width:24px;height:24px;display:flex;align-items:center;justify-content:center;opacity:.55}
.tile .arrow{position:absolute;right:20px;bottom:20px;font-size:22px;font-weight:900;opacity:0;transform:translate(-8px,8px);transition:all .25s cubic-bezier(.2,.8,.2,1)}
.tile:hover .arrow{opacity:1;transform:none}
.tile .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:24px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;background:rgba(255,255,255,.7);color:var(--ink)}
.chip.y{background:var(--y)}
.chip.r{background:#d7261e;color:#fff}
.tile.dark .chip{background:#2d2d2d;color:#fff}
.tile.dark .chip.y{background:var(--y);color:var(--ink)}
.tile.dim{opacity:.18!important;transform:none!important;box-shadow:none!important}
.tile.hit{box-shadow:8px 8px 0 var(--ink);transform:translate(-4px,-4px)}
.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}

.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#77776f;padding-top:8px;padding-bottom:40px}
.foot button{background:none;border:0;color:inherit;text-decoration:underline;padding:0}
.legend{display:flex;gap:14px;align-items:center}
.legend b{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

@media (max-width:900px){
  .wrap{padding-left:20px;padding-right:20px}
  .top{padding:22px 0 28px}
  .bar{flex-wrap:wrap}
  .brand{gap:14px;flex-wrap:wrap}
  .clock{font-size:26px}
  .search{width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:24px;row-gap:22px}
  .stat,.stat+.stat{padding:0 14px 0 0;border-right:0}
  .stat:nth-child(odd){border-right:1px solid var(--line)}
  .stat:nth-child(even){padding-left:14px}
  .stat .n{font-size:64px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .s5,.s4,.s3{grid-column:span 1}
  .tile{min-height:132px;padding:16px}
  .tile .nm{font-size:20px}
  .tile .ic{width:34px;height:34px}
  .tile .key,.kbd,.head span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1;transform:none}}
</style>
</head>
<body>

<section class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="mark">YSナビ</span>
        <span class="clock" id="clock">--:--</span>
        <span class="date" id="date"></span>
      </div>
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="text" autocomplete="off" placeholder="ツール名・案件番号で探す" title="ツールが1つに絞れたらEnterで開く。それ以外はEnterでドライブを検索" aria-label="ツールを探す・ドライブを検索">
        <span class="kbd">/</span>
      </label>
    </div>

    <div class="stats" id="stats">
      <a class="stat zero" id="st-pay" href="index.html">
        <span class="lbl">支払待ち</span>
        <span class="n"><span class="v">–</span><small>件</small></span>
        <span class="sub"></span>
        <span class="go">支払ナビで見る<i>→</i></span>
      </a>
      <a class="stat zero" id="st-arr" href="quality.html">
        <span class="lbl">今日・明日の入荷</span>
        <span class="n"><span class="v">–</span><small>件</small></span>
        <span class="sub"></span>
        <span class="go">品質ナビで見る<i>→</i></span>
      </a>
      <a class="stat zero" id="st-insp" href="quality.html">
        <span class="lbl">入荷検品まち</span>
        <span class="n"><span class="v">–</span><small>点</small></span>
        <span class="sub"></span>
        <span class="go">品質ナビで見る<i>→</i></span>
      </a>
      <a class="stat zero" id="st-bad" href="quality.html">
        <span class="lbl">不具合・遅れ</span>
        <span class="n"><span class="v">–</span><small>件</small></span>
        <span class="sub"></span>
        <span class="go">中身を見る<i>→</i></span>
      </a>
    </div>

    <div class="login" id="login">
      <span>Googleでログインすると、今日の数字が出ます（ほかのナビとログインは共通です）</span>
      <button type="button" id="loginBtn">ログイン</button>
    </div>
  </div>
</section>

<main class="wrap tools">
  <div class="head"><h2>ツール</h2><span>数字キー 1〜6 で開く</span></div>
  <div class="grid" id="grid">
    <a class="tile dark s5" style="--c:var(--pay);--fg:#fff;--i:0" href="index.html" data-k="1" data-words="支払 しはらい 発注 デポジット 入荷予定日 pay">
      <span class="key">1</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="nm">支払ナビ</span><span class="ds">発注・支払・入荷予定日</span>
      <span class="chips" id="c-pay"></span><span class="arrow">↗</span>
    </a>
    <a class="tile s4" style="--c:var(--inv);--i:1" href="inventory.html" data-k="2" data-words="在庫 ざいこ 入庫 引当 出庫 シリアル inventory">
      <span class="key">2</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
      <span class="nm">在庫ナビ</span><span class="ds">入庫待ち → 引当 → 出庫</span>
      <span class="chips" id="c-inv"></span><span class="arrow">↗</span>
    </a>
    <a class="tile s3" style="--c:var(--qual);--i:2" href="quality.html" data-k="3" data-words="品質 ひんしつ 検品 けんぴん 不具合 不良 quality">
      <span class="key">3</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg>
      <span class="nm">品質ナビ</span><span class="ds">検品・不具合の記録</span>
      <span class="chips" id="c-qual"></span><span class="arrow">↗</span>
    </a>
    <a class="tile dark s5" style="--c:#0f0f0f;--fg:#fff;--i:3" href="https://an-kan-47228502594.europe-west1.run.app" data-k="4" data-words="AN-KAN アンカン 案件 台帳 ステータス ankan">
      <span class="key">4</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      <span class="nm">AN-KAN</span><span class="ds">案件台帳・ステータス</span>
      <span class="chips" id="c-ankan"></span><span class="arrow">↗</span>
    </a>
    <a class="tile s4" style="--c:var(--prod);--i:4" href="genba.html" data-k="5" data-words="製品 せいひん マニュアル トラブル 研修 genba">
      <span class="key">5</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg>
      <span class="nm">製品ナビ</span><span class="ds">マニュアル・トラブル・研修</span>
      <span class="chips"></span><span class="arrow">↗</span>
    </a>
    <a class="tile s3" style="--c:var(--due);--i:5" href="https://yamato-72.github.io/ys-tools/deliverytime.html" data-k="6" data-words="納期 のうき 集荷 連休 中国 deliverytime">
      <span class="key">6</span>
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 14h3"/></svg>
      <span class="nm">納期ナビ</span><span class="ds">集荷日・納期の計算</span>
      <span class="chips"></span><span class="arrow">↗</span>
    </a>
  </div>
</main>

<div class="wrap foot">
  <span class="legend"><span><b style="background:var(--y)"></b>やることがある</span><span><b style="background:#d7261e"></b>不具合・遅れ</span></span>
  <span><span id="upd">数字はまだ読み込んでいません</span>　<button type="button" id="reload">今すぐ更新</button></span>
</div>

<script>
const IS_TEST = new URLSearchParams(location.search).has('test');
const INV_ID = IS_TEST ? '1VwfwgSgfCN3CsO-L2kwtfqggy5sW9eMIGW8bGczxcFE' : '1-Sv1ci9aQ80d5U42lTa2_eWfDCpsp2HESIOpHkOaxQQ';
const LOG_ID = IS_TEST ? '1GpIYAjtMUWNgQ3U-kmoC5ID2RRFRjWN9ZJdYwU42N_w' : '1JdFUk07s9KsBskn3qfYu1pym4uY1xq2evS-5N4xRtXg';
const LOG_SHEET = '品質イベントログ（倉庫を通り抜けたもの）';
const ANKAN_API = 'https://an-kan-47228502594.europe-west1.run.app/api/dashboard/external-summary';
const CLIENT_ID = '47228502594-hk66ecflb2s5iq02rim3o8j0j87d2p3c.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.readonly'; // ほかのナビと同じ権限（ログイン共有のため）
const WH = ['在庫中', '検品待ち', '引当済', '不良品'];
const $ = id => document.getElementById(id);

/* ---------- 時計 ---------- */
const fmtTime = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDate = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'long', day: 'numeric', weekday: 'short' });
function tick() { const d = new Date(); $('clock').textContent = fmtTime.format(d); $('date').textContent = fmtDate.format(d); }
tick(); setInterval(tick, 10000);

/* ---------- タイル：マウスの光・キーボード・検索 ---------- */
const tiles = [...document.querySelectorAll('.tile')];
tiles.forEach(t => t.addEventListener('pointermove', e => {
  const r = t.getBoundingClientRect();
  t.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  t.style.setProperty('--my', (e.clientY - r.top) + 'px');
}));
const q = $('q');
function nrm(s) { return String(s || '').normalize('NFKC').toLowerCase(); }
function matches() {
  const v = nrm(q.value.trim());
  if (!v) return [];
  return tiles.filter(t => nrm(t.dataset.words + ' ' + t.querySelector('.nm').textContent).includes(v));
}
q.addEventListener('input', () => {
  const v = q.value.trim(), hit = matches();
  tiles.forEach(t => { t.classList.toggle('dim', !!v && !hit.includes(t)); t.classList.toggle('hit', hit.length === 1 && hit[0] === t); });
});
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const hit = matches(), v = q.value.trim();
  if (hit.length === 1) location.href = hit[0].href;
  else if (v) window.open('https://drive.google.com/drive/search?q=' + encodeURIComponent(v), '_blank');
});
document.addEventListener('keydown', e => {
  if (e.target === q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); return; }
  const t = tiles.find(x => x.dataset.k === e.key);
  if (t) { t.classList.add('hit'); location.href = t.href; }
});

/* ---------- ログイン（ほかのナビと共有） ---------- */
function savedToken() {
  try { const t = localStorage.getItem('googleAccessToken'), ex = +localStorage.getItem('tokenExpiresAt'); if (t && ex > Date.now() + 5 * 60000) return t; } catch (e) {}
  return null;
}
let tokenClient = null;
function loadScript(src) { return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }); }
async function login() {
  if (!window.google || !google.accounts) await loadScript('https://accounts.google.com/gsi/client');
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: r => {
      if (r.error) return;
      try { localStorage.setItem('googleAccessToken', r.access_token); localStorage.setItem('tokenExpiresAt', String(Date.now() + (r.expires_in || 3600) * 1000)); } catch (e) {}
      loadNumbers();
    }
  });
  tokenClient.requestAccessToken({ prompt: '' });
}
$('loginBtn').onclick = login;
$('reload').onclick = () => { loadNumbers(); loadAnkan(); };

/* ---------- 数字の計算（品質ナビの朝通知と同じ考え方） ---------- */
function norm(s) { return String(s || '').replace(/[\s　]/g, '').toUpperCase().replace(/-0+(\d)/g, '-$1'); }
function okn(o) { return String(o || '').toUpperCase().replace(/\s/g, '').replace(/-0+(\d)/, '-$1'); }
function toYmd(v) { const m = String(v || '').trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2) : ''; }
const fmtYmd = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }); // YYYY-MM-DD
function projKey(p1, p2) { p1 = String(p1 || ''); return okn(/^[A-Z]+-\d+$/i.test(p1) ? p1 : (p1 || 'AD').replace(/-$/, '') + '-' + (p2 || '')); }

async function sheets(id, ranges, token) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?` + ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&') + '&valueRenderOption=FORMATTED_VALUE';
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401 || res.status === 403) { const e = new Error('auth'); e.auth = true; throw e; }
  if (!res.ok) throw new Error('sheets ' + res.status);
  return (await res.json()).valueRanges.map(v => v.values || []);
}

function compute(invRows, projRows, logRows, now) {
  const today = fmtYmd.format(now), tomorrow = fmtYmd.format(new Date(now.getTime() + 864e5));
  // 支払待ち：未払いの回が残っている案件（支払ナビの「今日の確認」と同じ数え方）
  const payProj = new Set(); let payRounds = 0;
  const arrival = {};
  projRows.forEach(r => {
    let deps = []; try { deps = JSON.parse(r[6] || '[]'); } catch (e) {}
    const unpaid = Array.isArray(deps) ? deps.filter(d => d && !d.paid).length : 0;
    const k = projKey(r[1], r[2]);
    if (unpaid) { payProj.add(k); payRounds += unpaid; }
    const d = toYmd(r[16]); if (d && (!arrival[k] || d < arrival[k])) arrival[k] = d;
  });
  // 在庫
  const inv = invRows.filter(r => r[1] || r[3]).map(r => ({
    s: String(r[1] || '').trim(),
    o: (r[5] !== '' && r[5] !== undefined) ? String(r[4] || '') + '-' + r[5] : String(r[4] || ''),
    st: String(r[8] || '入庫待ち')
  }));
  const waitingOrders = {};
  inv.filter(x => x.s && x.st === '入庫待ち').forEach(x => { waitingOrders[x.o] = (waitingOrders[x.o] || 0) + 1; });
  let arrToday = 0, arrTomorrow = 0, late = 0;
  Object.keys(waitingOrders).forEach(o => {
    const d = arrival[okn(o)]; if (!d) return;
    if (d === today) arrToday++; else if (d === tomorrow) arrTomorrow++; else if (d < today) late++;
  });
  const wh = inv.filter(x => x.s && WH.includes(x.st));
  const inspWait = wh.filter(x => x.st === '検品待ち').length;
  const bad = wh.filter(x => x.st === '不良品').length;
  const waitingIn = inv.filter(x => x.s && x.st === '入庫待ち').length;
  const allocated = inv.filter(x => x.s && x.st === '引当済').length;
  return { payProj: payProj.size, payRounds, arrToday, arrTomorrow, late, inspWait, bad, waitingIn, allocated };
}

/* ---------- 表示 ---------- */
function countTo(el, to) {
  const from = 0, t0 = performance.now(), dur = 650;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || to === 0) { el.textContent = to; return; }
  (function step(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); })(t0);
}
function setStat(id, val, sub, kind) {
  const el = $(id); el.classList.remove('zero', 'act', 'alert');
  el.classList.add(val === 0 ? 'zero' : kind);
  countTo(el.querySelector('.v'), val);
  el.querySelector('.sub').textContent = sub;
}
function chips(id, list) { $(id).innerHTML = list.filter(c => c[0] > 0).map(c => `<span class="chip ${c[2] || ''}">${c[1]} ${c[0]}${c[3] || ''}</span>`).join(''); }

async function loadNumbers() {
  const token = savedToken();
  if (!token) { $('login').style.display = 'flex'; $('upd').textContent = 'ログインすると数字が出ます'; return; }
  $('login').style.display = 'none';
  $('upd').textContent = '読み込み中…';
  try {
    const [[invRows, projRows], [logRows]] = await Promise.all([
      sheets(INV_ID, ['在庫!A2:Q', '案件!A2:Q'], token),
      sheets(LOG_ID, ["'" + LOG_SHEET + "'!A2:N"], token).catch(() => [[]])
    ]);
    const c = compute(invRows, projRows, logRows, new Date());
    setStat('st-pay', c.payProj, c.payProj ? `未払いの回 ${c.payRounds}回分` : 'なし', 'act');
    setStat('st-arr', c.arrToday + c.arrTomorrow, (c.arrToday + c.arrTomorrow) ? `今日 ${c.arrToday}件・明日 ${c.arrTomorrow}件` : '予定なし', 'act');
    setStat('st-insp', c.inspWait, c.inspWait ? '倉庫に届いて検品がまだ' : 'なし', 'act');
    setStat('st-bad', c.bad + c.late, (c.bad + c.late) ? `不良品 ${c.bad}点・入荷遅れ ${c.late}件` : 'なし', 'alert');
    chips('c-pay', [[c.payProj, '支払待ち', 'y', '件']]);
    chips('c-inv', [[c.waitingIn, '入庫待ち', '', '点'], [c.allocated, '引当済', '', '点']]);
    chips('c-qual', [[c.inspWait, '検品まち', 'y', '点'], [c.bad, '不良品', 'r', '点']]);
    $('upd').textContent = '更新 ' + fmtTime.format(new Date()) + '（5分ごとに自動更新）';
  } catch (e) {
    if (e.auth) { try { localStorage.removeItem('googleAccessToken'); localStorage.removeItem('tokenExpiresAt'); } catch (x) {} $('login').style.display = 'flex'; $('upd').textContent = 'ログインが切れました'; return; }
    console.error(e); $('upd').textContent = '数字を読めませんでした';
  }
}
async function loadAnkan() {
  try {
    const res = await fetch(ANKAN_API); if (!res.ok) return;
    const a = await res.json();
    const active = Object.entries(a.pipeline || {}).filter(([s]) => s !== '残金請求済').reduce((n, [, v]) => n + v, 0);
    const soon = (a.deliveryAlerts || []).length;
    chips('c-ankan', [[active, '進行中', '', '件'], [soon, '納期7日以内', 'y', '件'], [a.trouble || 0, 'トラブル', 'r', '件']]);
  } catch (e) { /* AN-KANが読めなくてもハブは使える */ }
}
loadNumbers(); loadAnkan();
setInterval(() => { if (document.visibilityState === 'visible') { loadNumbers(); loadAnkan(); } }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (window.__last || 0) > 60000) { window.__last = Date.now(); loadNumbers(); loadAnkan(); } });
